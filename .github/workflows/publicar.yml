# Metatron generado por 6abinsky
name: Publicar MET4TRON
on:
  push:
    branches: [main]
    paths: ['site/**', 'github_publicar.py', '.github/workflows/publicar.yml']
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      monto:
        description: Monto recaudado en bolivianos
        required: false
        type: string
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: metatron-pages
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        id: pages
      - name: Preparar portal y depurar siete días
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          MONTO: ${{ inputs.monto }}
        run: python github_publicar.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
          retention-days: 1
      - uses: actions/deploy-pages@v4
        id: deploy
